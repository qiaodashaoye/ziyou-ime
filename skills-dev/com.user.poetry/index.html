<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>诗词助手</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font: 14px/1.5 system-ui, sans-serif; padding: 8px; }
  .bar { display: flex; gap: 6px; margin-bottom: 8px; }
  #poem-input {
    flex: 1; min-width: 0; padding: 7px 10px; font-size: 14px;
    border: 1px solid #9994; border-radius: 8px; background: #8881; color: inherit;
  }
  #poem-input.routing { border-color: #4a90d9; box-shadow: 0 0 0 2px #4a90d933; }
  button {
    padding: 7px 12px; border: none; border-radius: 8px;
    background: #4a90d9; color: #fff; font-size: 14px; cursor: pointer;
  }
  button.ghost { background: #8882; color: inherit; }
  .hint { color: #888; font-size: 12px; margin: 4px 2px 8px; }
  .card { border: 1px solid #9993; border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .card .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .card .title { font-weight: 600; }
  .card .author { color: #888; font-size: 12px; margin-left: 6px; }
  .card .send-all { padding: 3px 10px; font-size: 12px; }
  .line {
    display: inline-block; padding: 4px 8px; margin: 2px 4px 2px 0;
    border-radius: 6px; background: #4a90d91a; cursor: pointer; font-size: 14px;
  }
  .line:active { background: #4a90d955; }
  .err { color: #c0392b; padding: 8px 2px; white-space: pre-line; }
  #history { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  #history button { padding: 3px 10px; font-size: 12px; }
  #results { max-height: 300px; overflow-y: auto; }
</style>
</head>
<body>
  <div class="bar">
    <input id="poem-input" type="text" placeholder="诗句 / 题目 / 作者，如：明月、静夜思、李白">
    <button id="go">查询</button>
  </div>
  <div id="history"></div>
  <div class="hint">点单句发送单句；「整首」按原文标点发送全诗。候选栏联想可直接接龙名句。</div>
  <div id="results"></div>
  <script src="poems.js"></script>
  <script src="script.js"></script>
</body>
</html>
