<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'">
<title>每日一言</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: transparent; font-family: sans-serif; }
  .wrap { display: flex; flex-direction: column; height: 100%; padding: 6px; }
  .list { flex: 1; overflow-y: auto; }
  .card {
    padding: 10px 12px; margin-bottom: 6px; border-radius: 8px;
    background: rgba(127,127,127,.12); font-size: 15px; line-height: 1.5; color: inherit;
  }
  .card:active { background: rgba(127,127,127,.3); }
  .hint { font-size: 11px; opacity: .55; margin-top: 4px; }
  .refresh {
    flex: 0 0 34px; margin-top: 4px; border: none; border-radius: 6px;
    font-size: 14px; background: rgba(127,127,127,.2); color: inherit;
  }
  .refresh:active { background: rgba(127,127,127,.35); }
</style>
</head>
<body>
<div class="wrap">
  <div class="list" id="list"></div>
  <button class="refresh" id="refresh">换一批</button>
</div>
<script>
'use strict';
var QUOTES = [
  '生活明朗，万物可爱。',
  '慢慢来，比较快。',
  '心之所向，素履以往。',
  '万事尽头，终将如意。',
  '星光不问赶路人，时光不负有心人。',
  '保持热爱，奔赴山海。',
  '日拱一卒，功不唐捐。',
  '人间烟火气，最抚凡人心。',
  '既然选择了远方，便只顾风雨兼程。',
  '心中有丘壑，眉目作山河。',
  '愿你眼中总有光芒，活成你想要的模样。',
  '把喜欢的一切留在身边，这便是努力的意义。'
];
var PAGE = 3;
var page = 0;

function render() {
  var list = document.getElementById('list');
  list.innerHTML = '';
  var start = page * PAGE;
  for (var i = start; i < start + PAGE && i < QUOTES.length; i++) {
    (function (text) {
      var card = document.createElement('div');
      card.className = 'card';
      card.textContent = text;
      var hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = '点击上屏';
      card.appendChild(hint);
      card.addEventListener('click', function () {
        IMESkill.sendText(text); // card 模式：上屏即收起面板
      });
      list.appendChild(card);
    })(QUOTES[i]);
  }
}

document.getElementById('refresh').addEventListener('click', function () {
  IMESkill.haptic();
  page = (page + 1) % Math.ceil(QUOTES.length / PAGE);
  render();
  // 记住翻页位置（演示 storage API，重开面板从上次位置继续）
  IMESkill.storage.set('page', String(page));
});

// 恢复上次翻页位置后首次渲染
IMESkill.storage.get('page').then(function (saved) {
  var n = parseInt(saved, 10);
  if (!isNaN(n) && n >= 0 && n < Math.ceil(QUOTES.length / PAGE)) page = n;
  render();
}).catch(function () { render(); });
</script>
</body>
</html>
