<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'">
<title>计算器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  html, body { min-height: 100%; background: transparent; font-family: sans-serif; }
  body { overflow-y: auto; }  /* 面板过矮时整体滚动，不压缩按键 */
  /* 高度自适应：min-height 撑满面板（面板高即视口高），内容超出时随内容增长 */
  .calc { display: flex; flex-direction: column; min-height: 100vh; padding: 6px; gap: 6px; }
  /* 显示区：为宿主悬浮角标让位（左「‹ 计算器」/ 右「✕」）；高度由内容撑开 */
  .screen {
    flex: none; min-height: 52px; margin: 0 44px 0 88px; padding: 4px 12px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-end;
    background: rgba(127,127,127,.10); border: 1px solid rgba(127,127,127,.14);
    border-radius: 12px; overflow: hidden;
  }
  #display {
    max-width: 100%; font-size: 22px; font-weight: 500; line-height: 26px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    overflow-x: auto; color: inherit;
  }
  #display::-webkit-scrollbar { display: none; }
  #preview {
    height: 15px; font-size: 12px; line-height: 15px; opacity: .55;
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden;
  }
  .screen.err #display { color: #e53935; }
  .screen.err { animation: shake .25s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  /* 按键区：行高按内容自适应（至少 44px 触摸目标），面板更高时均分剩余空间 */
  .grid {
    flex: 1 1 auto; display: grid; grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: minmax(44px, 1fr); gap: 6px;
  }
  button {
    border: none; border-radius: 12px; padding: 8px 0;
    font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums;
    background: rgba(127,127,127,.14); color: inherit;
    transition: transform .06s ease, background-color .06s ease;
  }
  button:active { transform: scale(.94); background: rgba(127,127,127,.32); }
  .op { background: rgba(25,118,210,.16); font-weight: 600; }
  .op:active { background: rgba(25,118,210,.34); }
  .fn { background: rgba(229,57,53,.14); font-weight: 600; }
  .fn:active { background: rgba(229,57,53,.30); }
  .eq { background: #1976D2; color: #fff; font-weight: 600; }
  .eq:active { transform: scale(.94); background: #1565C0; }
  .send {
    grid-column: span 2; color: #fff; font-size: 17px; font-weight: 600;
    background: linear-gradient(135deg, #1E88E5, #1565C0);
  }
  .send:active { transform: scale(.97); filter: brightness(.85); }
  /* 矮屏（横屏/小键盘）：压缩留白与字号，保证五行按键完整可见 */
  @media (max-height: 340px) {
    .calc { padding: 4px; gap: 4px; }
    .grid { grid-auto-rows: minmax(36px, 1fr); gap: 4px; }
    .screen { min-height: 44px; }
    #display { font-size: 18px; line-height: 22px; }
    button { font-size: 16px; padding: 4px 0; }
  }
</style>
</head>
<body>
<div class="calc">
  <div class="screen" id="screen">
    <div id="display">0</div>
    <div id="preview"></div>
  </div>
  <div class="grid">
    <button class="fn" data-k="C">C</button><button class="fn" data-k="B">⌫</button>
    <button class="op" data-k="/">÷</button><button class="op" data-k="*">×</button>
    <button data-k="7">7</button><button data-k="8">8</button>
    <button data-k="9">9</button><button class="op" data-k="-">−</button>
    <button data-k="4">4</button><button data-k="5">5</button>
    <button data-k="6">6</button><button class="op" data-k="+">+</button>
    <button data-k="1">1</button><button data-k="2">2</button>
    <button data-k="3">3</button><button class="eq" data-k="=">=</button>
    <button data-k="0">0</button><button data-k=".">.</button>
    <button class="send" data-k="S">上屏</button>
  </div>
</div>
<script>
'use strict';
var expr = '';
var screen = document.getElementById('screen');
var display = document.getElementById('display');
var preview = document.getElementById('preview');

function render() {
  screen.classList.remove('err');
  display.textContent = expr === '' ? '0' : expr;
  display.scrollLeft = display.scrollWidth;  // 长表达式始终展示末尾
  // 实时预览：表达式含算符且可完整求值时，灰字显示"= 结果"
  var hint = '';
  if (/\d[+\-*/]/.test(expr) && /\d$/.test(expr)) {
    try {
      var r = evaluate(expr);
      if (r !== null && r !== expr) hint = '= ' + r;
    } catch (e) { /* 未完成的表达式不提示 */ }
  }
  preview.textContent = hint;
}

function renderError() {
  display.textContent = '错误';
  preview.textContent = '';
  screen.classList.add('err');
  expr = '';
}

/* 无 eval 的四则运算求值（CSP 禁 unsafe-eval）：双栈算符优先 */
function evaluate(input) {
  var tokens = input.match(/(\d+\.?\d*|[+\-*/])/g);
  if (!tokens) return null;
  var values = [], ops = [];
  var prec = { '+': 1, '-': 1, '*': 2, '/': 2 };
  function apply() {
    var op = ops.pop(), b = values.pop(), a = values.pop();
    if (a === undefined || b === undefined) throw new Error('bad');
    if (op === '+') values.push(a + b);
    else if (op === '-') values.push(a - b);
    else if (op === '*') values.push(a * b);
    else { if (b === 0) throw new Error('div0'); values.push(a / b); }
  }
  var expectNum = true;
  for (var i = 0; i < tokens.length; i++) {
    var t = tokens[i];
    if (prec[t]) {
      if (expectNum && t === '-') { tokens[i + 1] = '-' + tokens[i + 1]; continue; } // 负号
      if (expectNum) throw new Error('bad');
      while (ops.length && prec[ops[ops.length - 1]] >= prec[t]) apply();
      ops.push(t);
      expectNum = true;
    } else {
      values.push(parseFloat(t));
      expectNum = false;
    }
  }
  if (expectNum) throw new Error('bad');
  while (ops.length) apply();
  var result = values.pop();
  if (!isFinite(result)) throw new Error('overflow');
  // 消浮点尾差：最多保留 10 位小数并去尾零
  return parseFloat(result.toFixed(10)).toString();
}

function calc() {
  try {
    var result = evaluate(expr);
    if (result !== null) { expr = result; render(); }
  } catch (e) {
    renderError();
  }
}

document.querySelector('.grid').addEventListener('click', function (e) {
  var k = e.target.getAttribute('data-k');
  if (!k) return;
  IMESkill.haptic();
  if (k === 'C') { expr = ''; render(); }
  else if (k === 'B') { expr = expr.slice(0, -1); render(); }
  else if (k === '=') { calc(); }
  else if (k === 'S') {
    calc();
    if (expr !== '') IMESkill.sendText(expr);
  }
  else { expr += k; render(); }
});

// 长按 ⌫ 直接清空表达式
(function () {
  var timer = null;
  var bs = document.querySelector('[data-k="B"]');
  bs.addEventListener('touchstart', function () {
    timer = setTimeout(function () {
      timer = null;
      IMESkill.haptic();
      expr = '';
      render();
    }, 500);
  }, { passive: true });
  ['touchend', 'touchcancel'].forEach(function (ev) {
    bs.addEventListener(ev, function () {
      if (timer) { clearTimeout(timer); timer = null; }
    });
  });
})();
render();
</script>
</body>
</html>
