# Rime schema
# encoding: utf-8
#
# 九宫格（T9）拼音方案 —— 智能九键（单击数字键，引擎消歧）
#
# 复用 luna_pinyin 词库。核心原理（参考 rime-ice / 薄荷九宫格）：
#   speller/algebra 通过 derive 把每个拼音字母额外派生出「数字键」写法，
#   2=abc 3=def 4=ghi 5=jkl 6=mno 7=pqrs 8=tuv 9=wxyz，
#   于是输入 486 可命中 guo/gun/huo/hun 等所有映射到 486 的音节，由引擎消歧。
#   spelling_hints 让候选携带其真实拼音（作为 comment），供客户端「拼音候选区」展示。
#   ' （撇号）用于手动分词（由键盘「分词」键发送）。

schema:
  schema_id: t9
  name: 中文九键
  version: "2.3"
  author:
    - 字由输入法
  description: |
    智能九宫格（T9）拼音方案，复用朙月拼音词库。
    单击数字键 2-9 输入，由引擎在所有可能拼音组合中匹配候选。
    配合九宫格键盘左侧标点键（，。！？）快速输入标点。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, ABC ]
  - name: simplification
    reset: 0
    states: [ 简体, 繁体 ]
  - name: ascii_punct
    reset: 0
    states: [ 中文标点, 西文标点 ]
  - name: prediction
    reset: 1
    states: [ 关闭联想, 开启联想 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - predictor          # librime-predict：上屏后生成预测候选（须在 key_binder 之前）
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - predict_translator # librime-predict：翻译 prediction 段的预测候选
  filters:
    - simplifier@zh_trad
    - uniquifier

# librime-predict 联想配置（predict.db 由 AssetDeployer 部署到用户目录）
predictor:
  db: predict.db
  # 单次预测候选数（与候选栏容量匹配，避免预测霸屏）
  max_candidates: 10
  # 连续联想最大轮数（防无限联想链）
  max_iterations: 3

speller:
  # 数字键与字母共同构成编码字母表；空格与撇号用于分词
  alphabet: 'zyxwvutsrqponmlkjihgfedcba9876543210'
  delimiter: " '"
  algebra:
    - erase/^xx$/
    # 超级简拼（首字母），zh/ch/sh 视为整体
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    # 常见容错
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    # ── 九宫格数字映射（保留字母写法，额外派生数字写法）──
    # 每个字母既保留原始字母编码，又新增对应数字编码，
    # 引擎同时匹配字母拼音和数字编码，从而实现智能消歧。
    - derive/[abc]/2/
    - derive/[def]/3/
    - derive/[ghi]/4/
    - derive/[jkl]/5/
    - derive/[mno]/6/
    - derive/[pqrs]/7/
    - derive/[tuv]/8/
    - derive/[wxyz]/9/
    # ── 内置英文词/表情标记码（0 前缀）去标记与降级（必须在数字 derive 之后）──
    # 英文词编码以 0 作标记前缀（如 0ok），经上方 derive 派生出带标记的
    # 数字拼写（0ok→065）后，在此去标记并降级为简拼(abbrev)拼写。
    # 降级是必需的：若英文词的九宫格整码（65）以 normal 拼写进入 prism，
    # Syllabifier 音节图剪枝会视其为「全拼整段命中」，把同编码上的全部
    # 中文简拼(kAbbreviation)路径剪掉，导致输入 65 只剩 ok/👌、中文候选消失。
    - abbrev/^0(.+)$/$1/
    - erase/^0.*$/

translator:
  dictionary: luna_pinyin
  enable_user_dict: true
  enable_sentence: true
  # 让候选携带真实拼音读音（作为 comment），供客户端拼音候选区展示
  spelling_hints: 32
  preedit_format:
    - xform/([nljqxy])v/$1ü/

zh_trad:
  option_name: simplification
  opencc_config: s2t.json
  tips: all

punctuator:
  import_preset: default

# 覆写按键绑定：九宫格键盘有专用标点键和退格键，
# 不需要 comma/period 翻页，确保标点键始终输出标点。
key_binder:
  import_preset: default
  bindings:
    # 覆盖默认设置中的逗号/句号翻页行为，使其始终作为标点输入
    - { when: has_menu, accept: comma, send: comma }
    - { when: has_menu, accept: period, send: period }

recognizer:
  import_preset: default
