# Rime schema
# encoding: utf-8
#
# 九宫格（T9）拼音方案 —— 智能九键（单击数字键，引擎消歧）
#
# 复用 rime_frost 词库（白霜拼音，2026-08 自 luna_pinyin 换装，见迁移方案 4.1.4：
#   仅换 translator.dictionary，algebra/predictor/key_binder 全部保留；
#   frost 原生 rime_frost_t9 因私有 t9_processor 硬阻塞，暂不处理/二期评估）。
# 核心原理（参考 rime-ice / 薄荷九宫格）：
#   speller/algebra 通过 derive 把每个拼音字母额外派生出「数字键」写法，
#   2=abc 3=def 4=ghi 5=jkl 6=mno 7=pqrs 8=tuv 9=wxyz，
#   于是输入 486 可命中 guo/gun/huo/hun 等所有映射到 486 的音节，由引擎消歧。
#   spelling_hints 让候选携带其真实拼音（作为 comment），供客户端「拼音候选区」展示。
#   ' （撇号）用于手动分词（由键盘「分词」键发送）。

schema:
  schema_id: t9
  name: 中文九键
  version: "2.9"
  author:
    - 字由输入法
  description: |
    智能九宫格（T9）拼音方案，复用白霜拼音（rime_frost）词库。
    单击数字键 2-9 输入，由引擎在所有可能拼音组合中匹配候选。
    配合九宫格键盘左侧标点键（，。！？）快速输入标点。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, ABC ]
  - name: simplification
    reset: 0
    states: [ 简体, 繁体 ]
  - name: ascii_punct
    reset: 0
    states: [ 中文标点, 西文标点 ]
  - name: prediction
    reset: 1
    states: [ 关闭联想, 开启联想 ]
  - name: emoji
    states: [ 💀, 😄 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - predictor          # librime-predict：上屏后生成预测候选（须在 key_binder 之前）
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@custom_phrase  # 数字编码自定义短语（custom_phrase_t9.txt，自建）
    - script_translator
    - predict_translator # librime-predict：翻译 prediction 段的预测候选
    - lua_translator@*force_gc        # 步进 GC，抑制大词库 + lua 的内存增长
  filters:
    - lua_filter@*is_in_user_dict     # 用户词 * / 联想句 ∞ 标记（顺序：先于 corrector）
    - lua_filter@*corrector           # 错音错字提示（corrections 四列表，双写 rime_user）
    - simplifier@emoji                # Emoji 变换（emoji 开关控制，默认关）
    - simplifier@zh_trad
    - uniquifier

# librime-predict 联想配置（predict.db 由 AssetDeployer 部署到用户目录）
predictor:
  db: predict.db
  # 单次预测候选数（与候选栏容量匹配，避免预测霸屏）
  max_candidates: 10
  # 连续联想最大轮数（7 轮支持「一句诗联想整首诗」链式补全：
  # 律诗 8 句 = 首句上屏 + 7 轮采纳；防无限联想链的兼顾值）
  max_iterations: 7

speller:
  # 数字键与字母共同构成编码字母表；空格与撇号用于分词
  alphabet: 'zyxwvutsrqponmlkjihgfedcba9876543210'
  delimiter: " '"
  algebra:
    - erase/^xx$/
    # 超级简拼（首字母），zh/ch/sh 视为整体
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    # 常见容错（correction 低权重，与 luna_pinyin.schema.yaml 同名规则保持同步）
    # 注：^([nl])ve$/$1ue 与 ^([jqxy])u/$1v 两条在九键下可证明冗余（u/v 同属 8 键，
    # lve=lue=583、ju=jv=58，数字编码完全相同，九键消歧天然覆盖），已于 2.8 移除
    # 以降低棱镜/音节图边数；全键盘方案保留
    - derive/un$/uen/correction
    - derive/ui$/uei/correction
    - derive/iu$/iou/correction
    - derive/([aeiou])ng$/$1gn   # ng→gn 换位（zhogn）：派生拼写不与真实拼音冲突，正常权重保证纠错候选靠前
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/correction
    - derive/ong$/on/correction
    - derive/ao$/oa/correction
    - derive/([iu])a(o|ng?)$/a$1$2/correction
    # ── 模糊音（常开；仅高频对，控制候选噪声）──
    # fuzz 标签使模糊拼写带 log(0.5) 半权惩罚：候选仍正常展示（syllabifier
    # 剪枝对 fuzzy 拼写豁免），但排序让位于精确匹配。此前用无标签 derive 导致
    # 模糊匹配与精确匹配同权重：如 74894546454 下“求职经历”（职经模糊拼写
    # zi 匹配 94）排在“数字经济”（全精确匹配）之前
    - derive/^([zcs])h/$1/fuzz            # 平翘舌：zh→z ch→c sh→s
    - derive/([ei])n$/$1ng/fuzz           # 前后鼻音：en→eng in→ing
    - derive/([ei])ng$/$1n/fuzz           # 前后鼻音：eng→en ing→in
    # ── 错拼容错补充（correction 低权重，不与精确匹配竞争）──
    - derive/ie$/ei/correction            # ie/ei 颠倒（jie↔jei 手误）
    - derive/ei$/ie/correction
    - derive/an$/ang/correction           # 前后鼻音手误：an↔ang（降权，区别于常开模糊音）
    - derive/ang$/an/correction
    # ── 字母顺序颠倒容错（对标主流输入法错拼纠正）──
    # 注意：九键下多数换位（如 zhong/zhnog 同为 94664）本就被数字消歧覆盖，
    # 此规则组主要补盖跨数字键的换位（如 ing→ign：464→446）。
    # 派生拼写不与真实拼音冲突，用正常权重（无 correction 标签）保证纠错候选靠前；
    # ou/uo 等与真实音节双向冲突的对保留 correction 标签降权
    - derive/([aeiou])ng$/n$1g            # 元音与 n 换位：zhong→zhnog
    - derive/([aeiou])n$/n$1              # 元音与 n 换位（无尾 g）：ban→bna, lin→lni
    - derive/([iu])an$/a$1n               # 介母与元音换位：jian→jain, tuan→taun
    - derive/ou$/uo/correction            # ou/uo 换位：dou↔duo（均为真实音节，必须降权）
    - derive/uo$/ou/correction
    # ── 九宫格数字映射（保留字母写法，额外派生数字写法）──
    # 每个字母既保留原始字母编码，又新增对应数字编码，
    # 引擎同时匹配字母拼音和数字编码，从而实现智能消歧。
    - derive/[abc]/2/
    - derive/[def]/3/
    - derive/[ghi]/4/
    - derive/[jkl]/5/
    - derive/[mno]/6/
    - derive/[pqrs]/7/
    - derive/[tuv]/8/
    - derive/[wxyz]/9/
    # ── 内置英文词/表情标记码（0 前缀）去标记与降级（必须在数字 derive 之后）──
    # 英文词编码以 0 作标记前缀（如 0ok），经上方 derive 派生出带标记的
    # 数字拼写（0ok→065）后，在此去标记并降级为简拼(abbrev)拼写。
    # 降级是必需的：若英文词的九宫格整码（65）以 normal 拼写进入 prism，
    # Syllabifier 音节图剪枝会视其为「全拼整段命中」，把同编码上的全部
    # 中文简拼(kAbbreviation)路径剪掉，导致输入 65 只剩 ok/👌、中文候选消失。
    - abbrev/^0(.+)$/$1/
    - erase/^0.*$/

translator:
  dictionary: rime_frost
  enable_user_dict: true
  enable_sentence: true
  # 性能红线：此处刻意不开启 enable_correction。九键编码经 derive 映射后棱镜
  # 数字节点极稠密，而 NearSearchCorrector::ToleranceSearch（容错度硬编码 5）在
  # BuildSyllableGraph 中对每个顶点做邻键替换 BFS：数字键的邻键（keyboard_map）
  # 替换结果几乎都能命中稠密棱镜，剪枝失效导致路径组合爆炸，单键耗时随编码
  # 长度超线性增长（InputLogicController 慢按键日志可复现）。九键本身一码多音
  # 的消歧已覆盖绝大多数相邻键误触，故全键盘（luna_pinyin）保留、九键关闭。
  # 让候选携带真实拼音读音（作为 comment），供客户端拼音候选区展示；
  # 32→100 对齐 frost t9，供 corrector.lua 判定与多音节词注音覆盖。
  spelling_hints: 100
  always_show_comments: true   # corrector.lua：强制保留 comment 供判定
  comment_format:              # corrector.lua 契约：［］包裹（见 T9 白霜集成计划 3.2）
    - xform/^/［/              # 副作用：PinyinHintProvider 的 comment 回退路径被
    - xform/$/］/              # 白名单丢弃，由主路径 T9PinYinUtils 本地还原兜底
  preedit_format:
    - xform/([nljqxy])v/$1ü/

# 自定义短语：custom_phrase_t9.txt（frost 上游缺此文件，字由自建，数字编码）
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase_t9
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99

# Emoji（对齐全拼 rime_frost 的 emoji 配置；表文件随 assets 部署）
emoji:
  option_name: emoji
  opencc_config: emoji.json
  inherit_comment: false       # emoji 候选空注释，防污染拼音提示

# 用户词典标记（is_in_user_dict.lua 读取本开关；缺失时脚本默认 true）
is_in_user_dict: true

# 错音错字提示格式（corrector.lua 占位符，命中的纠错注音直接作 comment）
corrector: "{comment}"

zh_trad:
  option_name: simplification
  opencc_config: s2t.json
  tips: all

punctuator:
  import_preset: default

# 覆写按键绑定：九宫格键盘有专用标点键和退格键，
# 不需要 comma/period 翻页，确保标点键始终输出标点。
key_binder:
  import_preset: default
  bindings:
    # 覆盖默认设置中的逗号/句号翻页行为，使其始终作为标点输入
    - { when: has_menu, accept: comma, send: comma }
    - { when: has_menu, accept: period, send: period }

recognizer:
  import_preset: default
