# Rime schema
# encoding: utf-8

schema:
  schema_id: luna_pinyin
  name: 朙月拼音·简体
  version: "2026-08-10.3"
  author:
    - 佛振 <chen.sst@gmail.com>
  description: |
    简体中文拼音输入方案。
    词库基于雾凇拼音 (rime-ice) 长期维护的简体中文词库。
    https://github.com/iDvel/rime-ice

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, ABC ]
    abbrev: [ 中, Ａ ]
  - name: full_shape
    states: [ 半宽文字, 全宽文字 ]
  - name: simplification
    reset: 0
    states: [ 简体, 繁体 ]
    abbrev: [ 简, 繁 ]
  - name: ascii_punct
    states: [ 中文标点, 西文标点 ]
    abbrev: [ '。', '．' ]
  - name: prediction
    reset: 1
    states: [ 关闭联想, 开启联想 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - predictor          # librime-predict：上屏后生成预测候选（须在 key_binder 之前）
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@alphabet
    - affix_segmentor@cangjie
    - affix_segmentor@pinyin
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - script_translator
    - table_translator@cangjie
    - script_translator@pinyin
    - predict_translator # librime-predict：翻译 prediction 段的预测候选
  filters:
    - reverse_lookup_filter@cangjie_lookup
    - simplifier@zh_trad
    - uniquifier

# librime-predict 联想配置（predict.db 由 AssetDeployer 部署到用户目录）
predictor:
  db: predict.db
  max_candidates: 10
  max_iterations: 3

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve$/$1ue/correction
    - derive/^([jqxy])u/$1v/correction
    - derive/un$/uen/correction
    - derive/ui$/uei/correction
    - derive/iu$/iou/correction
    - derive/([aeiou])ng$/$1gn   # ng→gn 换位（zhogn）：派生拼写不与真实拼音冲突，正常权重保证纠错候选靠前
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/correction
    - derive/ong$/on/correction
    - derive/ao$/oa/correction
    - derive/([iu])a(o|ng?)$/a$1$2/correction
    # ── 模糊音（常开；仅高频对，控制候选噪声）──
    - derive/^([zcs])h/$1/                # 平翘舌：zh→z ch→c sh→s
    - derive/([ei])n$/$1ng/               # 前后鼻音：en→eng in→ing
    - derive/([ei])ng$/$1n/               # 前后鼻音：eng→en ing→in
    # ── 错拼容错补充（correction 低权重，不与精确匹配竞争）──
    - derive/ie$/ei/correction            # ie/ei 颠倒（jie↔jei 手误）
    - derive/ei$/ie/correction
    - derive/an$/ang/correction           # 前后鼻音手误：an↔ang（降权，区别于常开模糊音）
    - derive/ang$/an/correction
    # ── 字母顺序颠倒容错（对标主流输入法错拼纠正）──
    # 派生拼写（zhnog/bna/jain…）不与任何真实拼音冲突，用正常权重（无 correction 标签），
    # 保证纠错候选（中/种/钟）排在 zh'n'o'g 简拼句之前；
    # ou/uo 等与真实音节双向冲突的对保留 correction 标签降权，避免候选互串
    - derive/([aeiou])ng$/n$1g            # 元音与 n 换位：zhong→zhnog
    - derive/([aeiou])n$/n$1              # 元音与 n 换位（无尾 g）：ban→bna, lin→lni
    - derive/([iu])an$/a$1n               # 介母与元音换位：jian→jain, tuan→taun
    - derive/ou$/uo/correction            # ou/uo 换位：dou↔duo（均为真实音节，必须降权）
    - derive/uo$/ou/correction
    # ── 内置英文词/表情标记码（0 前缀）去标记与降级 ──
    # 英文词编码以 0 作标记前缀（如 0ok），去标记后降级为简拼(abbrev)拼写，
    # 避免英文整码以 normal 拼写触发 Syllabifier 剪枝挤掉中文候选；
    # 与 t9.schema.yaml 的同名规则保持同步（详见该文件注释）。
    - abbrev/^0(.+)$/$1/
    - erase/^0.*$/

translator:
  dictionary: luna_pinyin
  # 邻键误触纠正：引擎内置 QWERTY 邻键表（NearSearchCorrector）对输入做
  # 容错搜索，纠错候选低权重且限量产出，不影响精确匹配排序
  enable_correction: true
  preedit_format:
    - xform/([nljqxy])v/$1ü/

alphabet:
  tag: alphabet
  prefix: ':'
  suffix: ';'
  tips: 〔西文〕
  closing_tips: 〔中文〕

cangjie:
  tag: cangjie
  dictionary: cangjie5
  prefix: 'C:'
  suffix: ';'
  tips: 〔倉頡〕
  closing_tips: 〔拼音〕
  preedit_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符|"
  comment_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz~|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符～|"

pinyin:
  tag: pinyin
  dictionary: luna_pinyin
  enable_user_dict: false
  prefix: 'P:'
  suffix: ';'
  tips: 〔拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/

cangjie_lookup:
  tags: [ pinyin ]
  dictionary: cangjie5
  comment_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz ~|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符、～|"

reverse_lookup:
  dictionary: cangjie5
  enable_completion: true
  prefix: '`'
  suffix: "'"
  tips: 〔倉頡〕
  preedit_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符|"
  comment_format:
    - xform/([nl])v/$1ü/

zh_trad:
  option_name: simplification
  opencc_config: s2t.json
  tips: all

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    alphabet: '(?<![A-Z]):[^;]*;?$'
    cangjie: "C:[a-z']*;?$"
    pinyin: "P:[a-z']*;?$"
    reverse_lookup: "`[a-z]*'?$"
