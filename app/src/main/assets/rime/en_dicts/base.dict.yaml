# Rime dictionary
# encoding: utf-8
#
# 字由输入法内置英文词 + 表情映射表
#
# 用途：中文模式下直接输入英文单词（全键盘键入 ok）或九宫格数字编码
# （t9 方案的 speller/algebra 会把编码派生出 65）时，
# 在中文候选之外追加英文词与表情候选。
#
# 词条格式：上屏文本<TAB>编码<TAB>权重
#   - 编码统一以数字 0 作标记前缀（如 0ok），配合方案 algebra 末尾两条规则：
#       abbrev/^0(.+)$/$1/  去标记并降级为简拼(abbrev)拼写
#       erase/^0.*$/        清除残留标记拼写
#     标记是必需的：若英文码的九宫格数字拼写（如 ok→65）以 normal 类型进入
#     prism，Syllabifier 的音节图剪枝会视其为「全拼整段命中」，把同编码上的
#     全部中文简拼(kAbbreviation)路径当作次等拼写剪掉，导致输入 65 时只剩
#     ok/👌、中文候选消失。降级为 abbrev 后两者共存（英文码带轻微降权，
#     候选排位自然位于高频中文之后）。
#   - 0 不出现在任何拼音音节中，且九宫格/全键盘中文模式都不会输入数字 0，
#     标记不会与拼音编码冲突。
#   - 权重按同编码中文竞争者数据校准（候选排序 ≈ 权重原始值线性降序，
#     见 script_translator 的 quality 公式）：
#     * Tier S（ok/OK/👌，编码 65 无全拼拼音音节冲突）：权重压过全部竞争者
#       （含首键单字），与主流输入法「65→OK 置顶」体验一致；
#     * 其余词条：压过同编码整段简拼中文词，但不超过全拼单音节词
#       （如 88 的 图 必须压过 tv）与顶级单字（是/一/的 等），
#       上限 120 万，保证中文候选正常排序不受扰动。
#
